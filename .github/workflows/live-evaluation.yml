name: Live evaluation

# Runs the golden tasks against the real model and uploads the report. It is not a required check
# for pull requests: those use recordings. Manual runs always work. The weekly run happens only
# when the repository variable LIVE_EVALUATION_SCHEDULE is set to "true".

on:
  workflow_dispatch:
    inputs:
      prompt_version:
        description: Prompt version to evaluate. Leave empty for the latest.
        required: false
        default: ""
      model:
        description: Model to evaluate.
        required: false
        default: claude-haiku-5-5
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  evaluate:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.LIVE_EVALUATION_SCHEDULE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -c constraints.txt
      - name: Evaluate against the real model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROMPT_VERSION: ${{ inputs.prompt_version }}
          MODEL: ${{ inputs.model || 'claude-haiku-5-5' }}
        run: |
          python -m observable_analytics_agent evaluate --mode live \
            --model "$MODEL" ${PROMPT_VERSION:+--prompt-version "$PROMPT_VERSION"} \
            --output evaluation-report.json
      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-evaluation-report
          path: evaluation-report.json
          if-no-files-found: ignore
